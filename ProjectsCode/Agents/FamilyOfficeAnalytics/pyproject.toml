[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "family-office-analytics"
version = "0.1.0"
description = "Extract and analyze fixed income positions from private bank statements"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "duckdb>=0.10.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
foa = "src.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
